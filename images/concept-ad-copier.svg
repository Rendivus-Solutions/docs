      <stop offset="0" stop-color="#16294D"/><stop offset="0.6" stop-color="#23467F"/><stop offset="1" stop-color="#3568C4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6"><stop offset="0" stop-color="#4F88E4" stop-opacity="0.5"/><stop offset="1" stop-color="#4F88E4" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="24" fill="url(#glow)"/>
  <circle cx="150" cy="80" r="90" fill="#fff" opacity="0.05"/>
