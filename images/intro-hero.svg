<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-label="Raddivus AI marketing copilot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16294D"/>
      <stop offset="0.55" stop-color="#23467F"/>
      <stop offset="1" stop-color="#3568C4"/>
    </linearGradient>
    <linearGradient id="tile" x1="500" y1="140" x2="700" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5B93EC"/>
      <stop offset="1" stop-color="#3F77D8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#4F88E4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4F88E4" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#0A1733" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="480" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="480" rx="28" fill="url(#glow)"/>

  <!-- ambient bokeh -->
  <circle cx="170" cy="120" r="120" fill="#ffffff" opacity="0.05"/>
  <circle cx="1040" cy="370" r="150" fill="#ffffff" opacity="0.05"/>
  <circle cx="980" cy="90" r="60" fill="#ffffff" opacity="0.06"/>

  <!-- floating ad-creative card (left) -->
  <g transform="rotate(-9 300 250)" opacity="0.92">
    <rect x="208" y="176" width="184" height="150" rx="16" fill="#ffffff" opacity="0.10"/>
    <rect x="208" y="176" width="184" height="150" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.22"/>
    <rect x="228" y="196" width="144" height="78" rx="9" fill="#ffffff" opacity="0.16"/>
    <rect x="228" y="286" width="104" height="11" rx="5.5" fill="#ffffff" opacity="0.28"/>
    <rect x="228" y="304" width="64" height="9" rx="4.5" fill="#ffffff" opacity="0.18"/>
  </g>

  <!-- floating analytics card (right) -->
  <g transform="rotate(8 905 245)" opacity="0.95">
    <rect x="812" y="168" width="196" height="158" rx="16" fill="#ffffff" opacity="0.10"/>
    <rect x="812" y="168" width="196" height="158" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.22"/>
    <polyline points="834,292 868,262 902,278 936,224 982,206" fill="none" stroke="#9FC2F4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="982" cy="206" r="6" fill="#CFE0FB"/>
    <rect x="834" y="306" width="84" height="9" rx="4.5" fill="#ffffff" opacity="0.22"/>
  </g>

  <!-- AI sparkles -->
  <g fill="#CFE0FB">
    <path d="M735 120 l7 18 18 7 -18 7 -7 18 -7 -18 -18 -7 18 -7 z" opacity="0.85"/>
    <path d="M470 360 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 z" opacity="0.7"/>
    <circle cx="1075" cy="190" r="5" opacity="0.7"/>
    <circle cx="150" cy="320" r="5" opacity="0.6"/>
  </g>

  <!-- Raddivus logo tile -->
  <g filter="url(#shadow)">
    <rect x="500" y="140" width="200" height="200" rx="46" fill="url(#tile)"/>
    <rect x="500" y="140" width="200" height="200" rx="46" fill="none" stroke="#ffffff" stroke-opacity="0.20"/>
  </g>
  <g transform="translate(540 139.25) scale(1.25)">
    <path d="M52.9231 21.6035C76.7138 21.6035 96 40.8646 96 64.6243C96 83.1461 84.279 98.9315 67.8413 104.992L96 139.604H12.3077C5.51034 139.604 0 134.1 0 127.312V33.8952C0 27.1067 5.51034 21.6035 12.3077 21.6035H52.9231Z" fill="#ffffff"/>
    <circle cx="18" cy="18" r="18" transform="matrix(-1 0 0 1 67 40.6035)" fill="#4A82E0"/>
    <circle cx="9" cy="9" r="9" transform="matrix(-1 0 0 1 58 49.6035)" fill="#ffffff"/>
  </g>
</svg>
